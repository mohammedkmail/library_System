---
grails:
    profile: web
    codegen:
        defaultPackage: librarysystem
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false

info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'

spring:
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback-spring.xml'
                - '*.properties'

environments:
    development:
        management:
            endpoints:
                enabled-by-default: true
                web:
                    base-path: '/actuator'
                    exposure:
                        include: '*'

    production:
        management:
            endpoints:
                enabled-by-default: false

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident

        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded

            html:
                - text/html
                - application/xhtml+xml

            js: text/javascript

            json:
                - application/json
                - text/json

            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain

            hal:
                - application/hal+json
                - application/hal+xml

            xml:
                - text/xml
                - application/xml

    urlmapping:
        cache:
            maxsize: 1000

    controllers:
        defaultScope: singleton

    converters:
        encoding: UTF-8

    views:
        default:
            codec: html

        gsp:
            encoding: UTF-8
            htmlcodec: xml

            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false

dataSource:
    pooled: true
    jmxExport: true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: libraryuser
    password: ''
    url: jdbc:mysql://localhost:3306/library_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

environments:

    development:
        dataSource:
            dbCreate: update
            url: jdbc:mysql://localhost:3306/library_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

    test:
        dataSource:
            dbCreate: update
            driverClassName: org.h2.Driver
            username: sa
            password: ''
            url: jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE

    production:
        dataSource:
            dbCreate: none
            url: jdbc:h2:./prodDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE

            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2

---
# Spring Security Core

grails:
    plugin:
        springsecurity:

            userLookup:
                userDomainClassName: 'librarysystem.User'
                authorityJoinClassName: 'librarysystem.UserRole'

            authority:
                className: 'librarysystem.Role'

            controllerAnnotations:
                staticRules:

                    # =========================
                    # Public
                    # =========================

                    - pattern: /
                      access: ['permitAll']

                    - pattern: /error
                      access: ['permitAll']

                    - pattern: /index
                      access: ['permitAll']

                    - pattern: /index.gsp
                      access: ['permitAll']

                    - pattern: /shutdown
                      access: ['permitAll']

                    - pattern: /assets/**
                      access: ['permitAll']

                    - pattern: /**/js/**
                      access: ['permitAll']

                    - pattern: /**/css/**
                      access: ['permitAll']

                    - pattern: /**/images/**
                      access: ['permitAll']

                    - pattern: /**/favicon.ico
                      access: ['permitAll']


                    # =========================
                    # Book browsing - Public
                    # =========================

                    - pattern: /book
                      access: ['permitAll']

                    - pattern: /book/index
                      access: ['permitAll']

                    - pattern: /book/show/**
                      access: ['permitAll']


                    # =========================
                    # Book management - Admin
                    # =========================

                    - pattern: /book/create
                      access: ['ROLE_ADMIN']

                    - pattern: /book/save
                      access: ['ROLE_ADMIN']

                    - pattern: /book/edit/**
                      access: ['ROLE_ADMIN']

                    - pattern: /book/update/**
                      access: ['ROLE_ADMIN']

                    - pattern: /book/delete/**
                      access: ['ROLE_ADMIN']

                    - pattern: /book/cover/**
                      access: ['permitAll']
                    # =========================
                    # Admin management
                    # =========================

                    - pattern: /author/**
                      access: ['ROLE_ADMIN']

                    - pattern: /category/**
                      access: ['ROLE_ADMIN']

                    - pattern: /bookCopy/**
                      access: ['ROLE_ADMIN']

                    - pattern: /studyRoom/**
                      access: ['ROLE_ADMIN']


                    # =========================
                    # User-owned services
                    # =========================

                    - pattern: /borrowing/**
                      access: ['ROLE_USER', 'ROLE_ADMIN']

                    - pattern: /reservation/**
                      access: ['ROLE_USER', 'ROLE_ADMIN']

                    - pattern: /membership/**
                      access: ['ROLE_USER', 'ROLE_ADMIN']

                    - pattern: /purchase/**
                      access: ['ROLE_USER', 'ROLE_ADMIN']

                    - pattern: /digitalAccess/**
                      access: ['ROLE_USER', 'ROLE_ADMIN']

                    - pattern: /roomReservation/**
                      access: ['ROLE_USER', 'ROLE_ADMIN']


                    # =========================
                    # Dashboard
                    # =========================

                    - pattern: /dashboard
                      access: ['ROLE_USER', 'ROLE_ADMIN']

                    - pattern: /dashboard/**
                      access: ['ROLE_USER', 'ROLE_ADMIN']


                    # =========================
                    # REST API
                    # =========================

                    - pattern: /api/**
                      access: ['ROLE_USER', 'ROLE_ADMIN']


            filterChain:
                chainMap:

                    - pattern: /assets/**
                      filters: none

                    - pattern: /**/js/**
                      filters: none

                    - pattern: /**/css/**
                      filters: none

                    - pattern: /**/images/**
                      filters: none

                    - pattern: /**/favicon.ico
                      filters: none

                    - pattern: /**
                      filters: JOINED_FILTERS